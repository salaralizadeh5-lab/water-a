<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<title>پایش هوشمند منابع آب</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7f6;color:#17332b}
header{background:#0b6e4f;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}header small{opacity:.85}
main{max-width:900px;margin:auto;padding:14px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
nav button{flex:1;border:0;background:#fff;padding:11px 4px;font-size:11px;color:#456}
nav button.active{color:#0b6e4f;font-weight:bold}
.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:15px;border-radius:14px;background:#e9f5f0}.stat b{font-size:25px;display:block;color:#0b6e4f}
button,.btn{border:0;border-radius:12px;padding:12px 14px;background:#0b6e4f;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e9f5f0;color:#0b6e4f}.danger{background:#b42318}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd8d4;border-radius:10px;margin:5px 0 10px;background:#fff}
label{font-size:12px;color:#49635a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.point{border-right:4px solid #0b6e4f}.riskA{border-right-color:#b42318}.riskB{border-right-color:#d97706}.riskC{border-right-color:#2563eb}
.hidden{display:none}.muted{color:#6b7c76;font-size:12px}.ok{color:#087443}.warn{color:#b54708}
#map{height:360px;border-radius:14px;background:#e3eee9;overflow:hidden}
#map iframe{width:100%;height:100%;border:0}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>پایش هوشمند منابع آب</h1><small>رودخانه‌ها، بستر، حریم و تخلفات</small></header>
<main id="app"></main>
<nav>
<button data-page="home">داشبورد</button><button data-page="new">ثبت نقطه</button><button data-page="rivers">رودخانه‌ها</button><button data-page="map">نقشه</button><button data-page="more">بیشتر</button>
</nav>
<script>
const DBKEY='water_monitor_v2';
const defaults={
rivers:[{id:'DLI-001',name:'دلیچایی',province:'تهران',county:'دماوند',active:true,created:new Date().toISOString()}],
points:[],photos:[],cases:[],tracks:[],settings:{gpsAccuracy:20},
inspectors:[{id:'INS-001',name:'کارشناس فعلی',unit:'منابع آب',active:true}]
};
let db=JSON.parse(localStorage.getItem(DBKEY)||'null')||defaults;
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
function render(p='home'){
 if(p==='home') return home();
 if(p==='new') return newPoint();
 if(p==='rivers') return rivers();
 if(p==='map') return map();
 more();
}
function home(){
 app.innerHTML=`<div class="grid">
<div class="stat"><b>${db.rivers.filter(x=>x.active).length}</b>رودخانه فعال</div>
<div class="stat"><b>${db.points.length}</b>نقطه پایش</div>
<div class="stat"><b>${db.points.filter(x=>x.risk==='A').length}</b>ریسک A</div>
<div class="stat"><b>${db.cases.length}</b>پرونده</div></div>
<div class="card"><h3>ثبت سریع</h3><div class="row"><button onclick="page('new')">📍 ثبت نقطه جدید</button><button class="secondary" onclick="startTrack()">🚶 شروع پیمایش</button></div></div>
<div class="card"><h3>آخرین نقاط</h3>${db.points.slice(-5).reverse().map(pointCard).join('')||'<p class="muted">هنوز نقطه‌ای ثبت نشده است.</p>'}</div>`;
}
function newPoint(){
 const opts=db.rivers.filter(r=>r.active).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
 app.innerHTML=`<div class="card"><h2>ثبت نقطه جدید</h2>
<label>رودخانه</label><select id="river">${opts}</select>
<button onclick="getGPS()">📍 دریافت GPS خودکار</button><p id="gpsmsg" class="muted">برای ثبت نقطه، GPS را دریافت کنید.</p>
<div id="gpsfields" class="hidden">
<label>Latitude</label><input id="lat" readonly><label>Longitude</label><input id="lon" readonly>
<label>UTM Zone</label><input id="zone" readonly><label>UTM Easting</label><input id="east" readonly>
<label>UTM Northing</label><input id="north" readonly><label>ارتفاع</label><input id="alt" readonly>
<label>دقت GPS (متر)</label><input id="acc" readonly>
<label>نوع نقطه</label><select id="type">
${['برداشت آب','برداشت غیرمجاز','آبفروشی','احداث بنا','تجاوز به بستر','تجاوز به حریم','انسداد رودخانه','پل','دیوارکشی','خاکریزی','تخلیه نخاله','تصرف اراضی','چاه','قنات','چشمه','آبراهه','حادثه‌خیز','لایروبی','تعمیر و نگهداری','سازه آبی','سایر'].map(x=>`<option>${x}</option>`).join('')}</select>
<label>سطح ریسک</label><select id="risk"><option>A</option><option>B</option><option>C</option></select>
<label>نوع تخلف</label><input id="violation" placeholder="در صورت وجود">
<label>شرح وضعیت</label><textarea id="desc"></textarea>
<label>اقدام انجام‌شده</label><textarea id="action"></textarea>
<label>شماره پرونده</label><input id="caseNo">
<label>شماره اخطار</label><input id="warningNo">
<label>نام کارشناس</label><input id="inspector" value="${esc(db.inspectors[0]?.name||'')}">
<div class="row"><button onclick="document.getElementById('photo').click()">📷 افزودن عکس</button><input id="photo" type="file" accept="image/*" capture="environment" multiple class="hidden"><button onclick="savePoint()">💾 ذخیره نقطه</button></div>
</div></div>`;
}
let gps=null;
function getGPS(){
 if(!navigator.geolocation){gpsmsg.textContent='مرورگر از GPS پشتیبانی نمی‌کند.';return}
 gpsmsg.textContent='در حال دریافت موقعیت دقیق...';
 navigator.geolocation.getCurrentPosition(pos=>{
  const c=pos.coords;gps={lat:c.latitude,lon:c.longitude,alt:c.altitude,acc:c.accuracy};
  const u=utm(c.latitude,c.longitude);lat.value=c.latitude.toFixed(6);lon.value=c.longitude.toFixed(6);zone.value=u.zone;east.value=u.e.toFixed(3);north.value=u.n.toFixed(3);alt.value=c.altitude==null?'':c.altitude.toFixed(1);acc.value=c.accuracy.toFixed(1);
  gpsfields.classList.remove('hidden');gpsmsg.innerHTML=`<span class="ok">GPS دریافت شد — دقت ${c.accuracy.toFixed(1)} متر</span>`;
  if(c.accuracy>db.settings.gpsAccuracy) gpsmsg.innerHTML+=`<div class="warn">دقت GPS از حد تنظیم‌شده (${db.settings.gpsAccuracy} متر) کمتر است.</div>`;
 },e=>gpsmsg.textContent='خطا در GPS: '+e.message,{enableHighAccuracy:true,timeout:15000,maximumAge:0})
}
function utm(lat,lon){
 const a=6378137,ecc=0.00669438,k=0.9996;let z=Math.floor((lon+180)/6)+1,lo=(z-1)*6-180+3;
 let r=Math.PI/180,la=lat*r,L=(lon-lo)*r,e2=ecc/(1-ecc),N=a/Math.sqrt(1-ecc*Math.sin(la)**2),T=Math.tan(la)**2,C=e2*Math.cos(la)**2,A=Math.cos(la)*L;
 let M=a*((1-ecc/4-3*ecc**2/64-5*ecc**3/256)*la-(3*ecc/8+3*ecc**2/32+45*ecc**3/1024)*Math.sin(2*la)+(15*ecc**2/256+45*ecc**3/1024)*Math.sin(4*la)-(35*ecc**3/3072)*Math.sin(6*la));
 let E=k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*e2)*A**5/120)+500000;
 let NN=k*(M+N*Math.tan(la)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*e2)*A**6/720));
 if(lat<0)NN+=10000000;return{zone:z,e:E,n:NN}
}
async function savePoint(){
 if(!gps){alert('ابتدا GPS را دریافت کنید.');return}
 const r=db.rivers.find(x=>x.id===river.value);const id=r.id+'-P-'+String(db.points.filter(x=>x.riverId===r.id).length+1).padStart(4,'0');
 const p={id,riverId:r.id,riverName:r.name,createdAt:new Date().toISOString(),lat:gps.lat,lon:gps.lon,alt:gps.alt,acc:gps.acc,utm:utm(gps.lat,gps.lon),type:type.value,risk:risk.value,violation:violation.value,description:desc.value,action:action.value,caseNo:caseNo.value,warningNo:warningNo.value,inspector:inspector.value,photoCount:photo.files.length};
 db.points.push(p);save();
 if(photo.files.length) for(const f of photo.files){const reader=new FileReader();reader.onload=()=>{db.photos.push({id:uid('PHOTO'),pointId:id,riverId:r.id,name:f.name,data:reader.result,createdAt:new Date().toISOString()});save()};reader.readAsDataURL(f)}
 alert('نقطه با موفقیت ذخیره شد.');page('home')
}
function pointCard(p){return `<div class="card point risk${p.risk}"><b>${esc(p.type)}</b><div>${esc(p.id)} — ${esc(p.riverName)}</div><div class="muted">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)} | ریسک ${p.risk}</div><button class="secondary" onclick="kml('${p.id}')">Google Earth / KML</button></div>`}
function rivers(){
 app.innerHTML=`<div class="card"><h2>رودخانه‌ها</h2><button onclick="addRiver()">＋ افزودن رودخانه</button></div>`+db.rivers.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><div class="muted">${esc(r.id)} — ${esc(r.province||'')} ${esc(r.county||'')}</div><p>${db.points.filter(p=>p.riverId===r.id).length} نقطه پایش</p><button class="secondary" onclick="riverExport('${r.id}')">خروجی KML</button></div>`).join('');
}
function addRiver(){let n=prompt('نام رودخانه را وارد کنید:');if(!n)return;let id='RIV-'+String(db.rivers.length+1).padStart(3,'0');db.rivers.push({id,name:n,active:true,created:new Date().toISOString()});save();rivers()}
function map(){
 const pts=db.points;app.innerHTML=`<div class="card"><h2>نقشه</h2><div id="map"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=51%2C35%2C53%2C36%26layer=mapnik"></iframe></div></div><div class="card"><h3>نقاط</h3>${pts.map(pointCard).join('')||'<p>نقطه‌ای وجود ندارد.</p>'}</div>`;
}
function more(){
 app.innerHTML=`<div class="card"><h2>ابزارها</h2><button onclick="exportXLSX()">📊 خروجی Excel</button> <button onclick="backup()">💾 پشتیبان</button> <button class="secondary" onclick="restore()">♻️ بازیابی</button></div>
<div class="card"><h3>پیمایش</h3><button onclick="startTrack()">شروع پیمایش</button><button class="danger" onclick="stopTrack()">پایان پیمایش</button><p id="trackmsg" class="muted">مسیرها: ${db.tracks.length}</p></div>
<div class="card"><h3>وضعیت ذخیره‌سازی</h3><p class="ok">اطلاعات در حافظه محلی دستگاه ذخیره می‌شود و بدون اینترنت نیز قابل ثبت است.</p></div>`;
}
let trackTimer=null,track=null;
function startTrack(){if(trackTimer)return;track={id:uid('TRK'),start:new Date().toISOString(),points:[]};trackTimer=setInterval(()=>navigator.geolocation?.getCurrentPosition(p=>{track.points.push({lat:p.coords.latitude,lon:p.coords.longitude,t:new Date().toISOString()})}),5000);alert('پیمایش شروع شد.');}
function stopTrack(){if(!trackTimer)return;clearInterval(trackTimer);trackTimer=null;track.end=new Date().toISOString();db.tracks.push(track);save();alert('پیمایش ذخیره شد.');page('more')}
function kml(id){const p=db.points.find(x=>x.id===id);const d=`<![CDATA[رودخانه: ${p.riverName}<br>Point ID: ${p.id}<br>نوع نقطه: ${p.type}<br>تاریخ: ${p.createdAt}<br>Latitude: ${p.lat}<br>Longitude: ${p.lon}<br>UTM: ${p.utm.zone} / ${p.utm.e.toFixed(3)} / ${p.utm.n.toFixed(3)}<br>ارتفاع: ${p.alt??''}<br>دقت GPS: ${p.acc}<br>ریسک: ${p.risk}<br>تخلف: ${p.violation||''}<br>شرح: ${p.description||''}<br>اقدام: ${p.action||''}<br>پرونده: ${p.caseNo||''}<br>اخطار: ${p.warningNo||''}<br>کارشناس: ${p.inspector||''}]]>`;download(new Blob([`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2.0"><Placemark><name>${esc(p.type)}</name><description>${d}</description><Point><coordinates>${p.lon},${p.lat},${p.alt||0}</coordinates></Point></Placemark></kml>`],{type:'application/vnd.google-earth.kml+xml'}),p.id+'.kml')}
function riverExport(rid){const ps=db.points.filter(p=>p.riverId===rid);let k='<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2.0"><Document>';ps.forEach(p=>k+=`<Placemark><name>${esc(p.type)}</name><Point><coordinates>${p.lon},${p.lat},${p.alt||0}</coordinates></Point></Placemark>`);k+='</Document></kml>';download(new Blob([k],{type:'application/vnd.google-earth.kml+xml'}),'river.kml')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportXLSX(){const rows=[['Point ID','River ID','River Name','Date','Latitude','Longitude','UTM Zone','UTM Easting','UTM Northing','Altitude','GPS Accuracy','Point Type','Violation Type','Description','Action','Risk','Case Number','Warning Number','Inspector'],...db.points.map(p=>[p.id,p.riverId,p.riverName,p.createdAt,p.lat,p.lon,p.utm.zone,p.utm.e,p.utm.n,p.alt,p.acc,p.type,p.violation,p.description,p.action,p.risk,p.caseNo,p.warningNo,p.inspector])];let csv='\\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'WaterMonitor_Points.csv')}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'WaterMonitor_Backup.json')}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('بازیابی انجام شد');location.reload()}catch(e){alert('فایل پشتیبان معتبر نیست')}};r.readAsText(i.files[0])};i.click()}
page('home');
</script>
</body></html>
